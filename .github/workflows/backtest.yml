# Metti questo file in .github/workflows/backtest.yml.
# Da telefono: Actions > backtest-calibrazione > Run workflow > scrivi le giornate (es. 2,3).
# Ricostruisce la previsione che il modello avrebbe fatto PRIMA di quelle giornate (solo dati precedenti),
# poi la confronta con i voti di voti_reali.csv e aggiorna calibrazione.json.
name: backtest-calibrazione
on:
  workflow_dispatch:
    inputs:
      giornate:
        description: "Giornate da ricostruire, separate da virgola (es. 2,3)"
        required: true
        default: "2,3"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python fanta_predictor.py --backtest --giornata "$GIORNATE"
        env:
          GIORNATE: ${{ inputs.giornate }}
      - run: python fanta_predictor.py --calibra
      - run: |
          git config user.name "fanta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A storico calibrazione.json
          git diff --cached --quiet || (git commit -m "backtest e calibrazione" && git push)
