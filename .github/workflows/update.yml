# Metti questo file in .github/workflows/update.yml del tuo repository GitHub.
# Ogni giorno alle 07:00 UTC rigenera docs/index.html; attiva GitHub Pages su "main /docs"
# e apri la pagina dal telefono. (Non testato dal vivo: controlla il primo run in "Actions".)
name: aggiorna-previsioni
on:
  schedule: [{cron: "0 7 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python fanta_predictor.py --refresh
      - run: |
          git config user.name "fanta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "aggiornamento previsioni" && git push)
